name: TacTech
options:
  bundleIdPrefix: com.tactech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  TacTech:
    type: application
    platform: iOS
    sources:
      - path: TacTech
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tactech.trainer
        PRODUCT_NAME: TacTech
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: TacTech/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: TacTech
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: TacTech uses the camera for profile photos, body assessment, live form correction, and food scanning.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: TacTech uses the microphone for vocal fitness assessment.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: TacTech uses your photos for profile pictures and to estimate nutrition from meals.
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: TacTech/Info.plist
      properties:
        CFBundleDisplayName: TacTech
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: TacTech uses the camera for profile photos, body assessment, live form correction, and food scanning.
        NSMicrophoneUsageDescription: TacTech uses the microphone for vocal fitness assessment.
        NSPhotoLibraryUsageDescription: TacTech uses your photos for profile pictures and to estimate nutrition from meals.
        UIUserInterfaceStyle: Automatic
        UIAppFonts:
          - WorkSans-Regular.ttf
          - WorkSans-Bold.ttf
          - WorkSans-Variable.ttf
        NSAppTransportSecurity:
          NSExceptionDomains:
            sheryl-biocellate-sympathizingly.ngrok-free.dev:
              NSIncludesSubdomains: true
              NSExceptionRequiresForwardSecrecy: false
